name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mdk-ref: 633ee07905a6af1d9e0c44b770df09eb0ac432b4
            compatibility: minimum
          - mdk-ref: main
            compatibility: upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: proto-tether-mdk-worker
          persist-credentials: false

      - name: Check out MDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tetherto/mdk
          ref: ${{ matrix.mdk-ref }}
          path: mdk
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: proto-tether-mdk-worker/package-lock.json

      - name: Install MDK core dependencies
        working-directory: mdk/backend/core
        run: ./install-packages.sh

      - name: Install Worker dependencies
        working-directory: proto-tether-mdk-worker
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run Worker tests
        working-directory: proto-tether-mdk-worker
        env:
          MDK_REPO: ../mdk
        run: npm test

      - name: Run canonical Worker smoke test
        working-directory: proto-tether-mdk-worker
        env:
          MDK_WORKER_BASE: ${{ github.workspace }}/mdk/backend/core/mdk-worker
        run: node ../mdk/packages/mdk-skill/src/skills/mdk-worker-plugin/scripts/worker-smoke.mjs .

      - name: Reject non-public package registries
        working-directory: proto-tether-mdk-worker
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const entries = []

          for (const [name, meta] of Object.entries(lock.packages || {})) {
            entries.push(['packages', name, meta])
          }

          for (const [name, meta] of Object.entries(lock.dependencies || {})) {
            entries.push(['dependencies', name, meta])
          }

          let checked = 0
          let local = 0

          for (const [section, name, meta] of entries) {
            if (!meta || typeof meta !== 'object') {
              console.error(`package-lock integrity check failed: invalid ${section} entry ${JSON.stringify(name)}`)
              process.exit(1)
            }

            if (section === 'packages' && name === '') {
              if (meta.resolved != null) {
                console.error('package-lock integrity check failed: root package unexpectedly has a resolved source URL')
                process.exit(1)
              }
              local += 1
              continue
            }

            if (typeof meta.resolved !== 'string' || meta.resolved.length === 0) {
              console.error(`package-lock integrity check failed: ${section}:${name} is missing a resolved source URL`)
              process.exit(1)
            }

            checked += 1

            let url
            try {
              url = new URL(meta.resolved)
            } catch {
              console.error(`package-lock integrity check failed: ${section}:${name} has a malformed resolved source URL`)
              process.exit(1)
            }

            if (url.protocol !== 'https:' || url.hostname !== 'registry.npmjs.org') {
              console.error(`package-lock integrity check failed: ${section}:${name} resolved to non-public host ${url.hostname || '(empty)'}`)
              process.exit(1)
            }
          }

          console.log(`package-lock integrity check passed: ${checked} resolved entries allowlisted; ${local} local root entry`)
          NODE
